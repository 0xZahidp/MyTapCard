<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f9f3ef;font-family:Arial,sans-serif;color:#1b3c53">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f9f3ef;padding:32px 16px"><tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#fff;border:1px solid #e6dcd5;border-radius:20px;overflow:hidden">
        <tr><td style="background:#1b3c53;padding:24px 32px;color:#fff;font-size:22px;font-weight:700">MyTapCard</td></tr>
        <tr><td style="padding:36px 32px;text-align:center">
          <p style="margin:0 0 10px;color:#456882;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Identity check</p>
          <h1 style="margin:0 0 16px;font-size:28px">Your verification code</h1>
          <p style="margin:0 0 24px;color:#536675;font-size:16px;line-height:1.65">Enter this one-time code in MyTapCard to confirm it is really you.</p>
          <div style="display:inline-block;padding:16px 22px;border:1px solid #d2c1b6;border-radius:12px;background:#f9f3ef;font-size:30px;font-weight:700;letter-spacing:.2em">{{ .Token }}</div>
          <p style="margin:26px 0 0;color:#71808b;font-size:13px;line-height:1.5">Never share this code. MyTapCard support will never ask you for it.</p>
        </td></tr>
        <tr><td style="border-top:1px solid #eee5df;padding:20px 32px;color:#82909a;font-size:12px;text-align:center">MyTapCard account security · mytapcard.online</td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
