
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="180" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="600" cy="300" r="140" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Glass Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Brand Pill -->
  <g transform="translate(110, 115)">
    <rect width="210" height="42" rx="21" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <circle cx="24" cy="21" r="6" fill="#38bdf8" />
    <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">SMART NFC &amp; QR CARD</text>
  </g>

  <!-- Main Headline -->
  <text x="110" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    MyTapCard
  </text>
  <text x="110" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="34" font-weight="700" fill="url(#accent)" letter-spacing="-0.5">
    One tap. Every link. Shared everywhere.
  </text>

  <!-- Tagline -->
  <text x="110" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Build a polished digital business card, collect your contact details, and share instantly.
  </text>

  <!-- Feature Tags -->
  <g transform="translate(110, 420)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="190" height="42" rx="12" fill="rgba(14, 165, 233, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">⚡ Contactless NFC</text>

    <!-- Tag 2 -->
    <rect x="206" y="0" width="180" height="42" rx="12" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
    <text x="224" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#818cf8">📲 Dynamic QR</text>

    <!-- Tag 3 -->
    <rect x="402" y="0" width="180" height="42" rx="12" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
    <text x="420" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#c084fc">📇 1-Tap vCard</text>

    <!-- Tag 4 -->
    <rect x="598" y="0" width="190" height="42" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
    <text x="616" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#34d399">🌐 70+ Integrations</text>
  </g>

  <!-- Domain Branding Watermark -->
  <g transform="translate(110, 515)">
    <circle cx="8" cy="8" r="4" fill="#38bdf8" />
    <text x="22" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1" letter-spacing="0.2">
      https://www.mytapcard.online
    </text>
  </g>

  <!-- Illustration on the right -->
  <g transform="translate(860, 160)">
    <!-- Mock Phone Body -->
    <rect x="0" y="0" width="210" height="340" rx="36" fill="#1e293b" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" />
    <rect x="10" y="10" width="190" height="320" rx="28" fill="#0f172a" />
    <!-- Dynamic Island / Speaker -->
    <rect x="65" y="18" width="80" height="14" rx="7" fill="#020617" />
    <!-- Mini Profile Card Inside -->
    <rect x="25" y="55" width="160" height="100" rx="16" fill="url(#accent)" opacity="0.9" />
    <circle cx="55" cy="90" r="18" fill="#ffffff" />
    <rect x="85" y="80" width="75" height="10" rx="5" fill="#ffffff" />
    <rect x="85" y="96" width="50" height="6" rx="3" fill="rgba(255, 255, 255, 0.7)" />
    <!-- Mini Links Inside -->
    <rect x="25" y="170" width="160" height="28" rx="8" fill="rgba(255, 255, 255, 0.08)" />
    <rect x="25" y="206" width="160" height="28" rx="8" fill="rgba(255, 255, 255, 0.08)" />
    <rect x="25" y="242" width="160" height="28" rx="8" fill="rgba(255, 255, 255, 0.08)" />
    <!-- Mini Action Button -->
    <rect x="25" y="280" width="160" height="32" rx="10" fill="#38bdf8" />
  </g>
</svg>
